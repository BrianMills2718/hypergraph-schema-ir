[project]
name = "knowledgework"
version = "0.1.0"
description = "Declare a data model as a typed n-ary hypergraph; emit PostgreSQL, MongoDB and GraphQL schemas plus a verdict on the declared constraints."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# No runtime dependencies. Standard library only, and it never opens a socket.
dependencies = []

[project.scripts]
knowledgework = "knowledgework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledgework"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
